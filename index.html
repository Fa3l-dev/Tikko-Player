<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tikko Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Input invisível necessário para o seletor nativo do telemóvel -->
  <input type="file" id="file-input" accept="audio/*" multiple style="display: none;">

  <div class="container">
    <!-- Cabeçalho / Capa -->
    <div class="player-header">
      <div class="album-cover">
        <img src="assets/default-cover.png" id="cover-img" alt="Capa do Álbum">
      </div>
      <div class="track-info">
        <h2 id="track-title">Nenhuma música selecionada</h2>
        <p id="track-artist">Selecione uma pasta ou ficheiros</p>
      </div>
    </div>

    <!-- Controles do Player -->
    <div class="player-controls">
      <div class="progress-container">
        <span id="current-time">00:00</span>
        <input type="range" id="progress-bar" value="0" max="100">
        <span id="total-duration">00:00</span>
      </div>

      <div class="button-group">
        <button id="prev-btn" class="control-btn" title="Anterior">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        
        <button id="play-btn" class="control-btn main-btn" title="Reproduzir">
          <svg id="play-icon" viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        
        <button id="next-btn" class="control-btn" title="Próxima">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="volume-container">
        <button id="mute-btn" class="icon-btn">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02z"/></svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
      </div>
    </div>

    <!-- Ações e Seleção de Ficheiros -->
    <div class="action-bar">
      <button id="select-folder-btn" class="action-btn">Carregar Músicas</button>
    </div>

    <!-- Lista de Músicas / Playlist -->
    <div class="playlist-container">
      <h3>Sua Biblioteca</h3>
      <ul id="music-list" class="music-list"></ul>
    </div>
  </div>

  <!-- Bibliotecas e Scripts -->
  <script src="jsmediatags.min.js"></script>
  <script src="script.js"></script>

  <!-- Registo do Service Worker para suporte Offline (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registado com sucesso:', reg.scope))
          .catch(err => console.error('Falha ao registar o Service Worker:', err));
      });
    }
  </script>
</body>
</html>
